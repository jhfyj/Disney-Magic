<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&display=swap" rel="stylesheet">
  <style>

    
    :root {
      --LightBlue: #393E8F;
      --Purple: #C015D7;
    }

    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Tilt Warp', sans-serif;
    }

    .image {
    display: block;            /* Remove inline whitespace */
    width: 100%;              
    height: auto;              /* Preserve aspect ratio */
    margin: 0px;
    position: absolute;        /* Position the image relative to the container */
    bottom: 0;                 /* Stick the image to the bottom */
}

.container {
    width: 100%;
    height: 100%;
    position: relative;        /* This allows other elements inside to be positioned correctly */
    background: var(--LightBlue);
    overflow: hidden;          /* Hide any overflow from child elements */
}

.background-img {
    position: absolute;        /* Position the background image relative to the container */                 /* Align to the left */
    width: 100%;               /* Stretch to full width of the viewport */
    height: 100%;              /* Stretch to full height of the viewport */
       /* Ensure the image covers the area without distortion */

}

    .back-button {
      width: 68px;
      height: 29px;
      padding-left: 43px;
      padding-right: 43px;
      padding-top: 10px;
      padding-bottom: 10px;
      left: 23px;
      top: 28px;
      position: absolute;
      background: var(--Purple);
      border-radius: 57px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .back-button div {
      color: black;
      font-size: 20px;
      font-weight: 400;
      word-wrap: break-word;
    }

    .start-button-container {
      padding: 10px;
      bottom: 90px;
      left: 50%;  /* Horizontally centers the container */
      transform: translate(-50%, 0); /* Corrects the position to perfectly center */
      top: 453px;
      position: absolute;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .start-button {
      width: 200px;
      height: 200px;
      padding: 26px;
      position: relative;
      background: linear-gradient(0deg, #C79A20 0%, #C79A20 100%), #F3CC64;
      box-shadow: 0px 8px 12px rgba(0, 0, 0, 0.30);
      border-radius: 160.50px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .start-inner {
      width: 180px;
      height: 180px;
      background: #F3CC64;
      border-radius: 9999px;
    }

    .start-text {
        justify-content: center;
        align-items: center;
      position: absolute;
      color: black;
      font-size: 48px;
      font-weight: 400;
      word-wrap: break-word;
    }

    .intro-text {
      width: 224px;
      height: 70px;
      top: 143px;
      position: absolute;
      text-align: center;
      color: white;
      font-size: 24px;
      font-weight: 400;
      text-transform: uppercase;
      word-wrap: break-word;
      left: 50%;  /* Horizontally centers the container */
      transform: translate(-50%, 0); /* Corrects the position to perfectly center */

    }
  </style>
</head>

<body>

    <div class="container">
        
        <img class="background-img" src="assets/starbackground.jpg" alt="Background Image">
        <img class="image" src="assets/purple.png" />

        <div class="back-button" data-property-1="Villain" data-tomorrowland="Default">
          <div>Back</div>
        </div>
      
        <div class="start-button-container" data-property-1="Default">
          <div class="start-button">
            <div class="start-inner"></div>
            <div class="start-text">START</div>
          </div>
        </div>
      
        <div class="intro-text">
          Ready to get started?<br/>Press on the start button below!
        </div>
        
      </div>
      

</body>

</html>
